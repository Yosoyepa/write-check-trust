name: adoption-smoke

# Time-to-first-green: lo que un adoptador experimenta desde clon limpio,
# sin pasos que no estén en el README. Verde sin intervención o rojo.
on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  fresh-clone-green:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Actions pineadas por SHA completo, como el resto de los workflows.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Install uv
        run: python -m pip install --disable-pip-version-check uv
      - name: uv sync (como en el README)
        run: uv sync --frozen
      - name: wct doctor
        run: uv run wct doctor
      - name: tier fast
        run: uv run wct gate --tier fast
      - name: "tier commit (presupuesto: 120 s)"
        run: |
          start=$(date +%s)
          uv run wct gate --tier commit
          elapsed=$(( $(date +%s) - start ))
          echo "time-to-green(commit)=${elapsed}s"
          test "$elapsed" -le 120
