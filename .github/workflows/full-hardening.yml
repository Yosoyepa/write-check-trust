name: full-hardening

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

jobs:
  full:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check uv
      - run: uv sync --frozen --group dev --group quality
      - run: uv run wct gate --tier full
      - run: uv run wct accept mutate
      - run: uv run wct selftest redteam
      - name: Upload gate evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: quality-reports
          path: quality/reports/
          if-no-files-found: ignore

