name: full-hardening

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

concurrency:
  group: full-hardening
  cancel-in-progress: false

jobs:
  full:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      # Actions pineadas por SHA completo: un tag comprometido no ejecuta
      # código en este repo (Dependabot mantiene los SHAs al día).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check uv
      - run: uv sync --frozen --group dev --group quality
      # G-DRY-TOK corre con --exit-code 1 y el presupuesto de .jscpd.json;
      # sin jscpd en PATH el gate reporta SKIP y la duplicación por tokens
      # queda sin verificar.
      - name: Install jscpd for G-DRY-TOK
        run: npm install -g jscpd@5.0.16
      - run: uv run wct gate --tier full
      - run: uv run wct accept mutate
      - run: uv run wct selftest redteam
      - name: Upload gate evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: quality-reports
          path: quality/reports/
          if-no-files-found: ignore
