name: quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  commit-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv
        run: python -m pip install --disable-pip-version-check uv
      - name: Install deterministic environment
        run: uv sync --frozen --group dev --group quality
      - name: Verify generated policy and control-plane integrity
        run: |
          uv run wct rules check
          uv run wct integrity check
          uv run wct doctor
      - name: Run commit tier
        run: uv run wct gate --tier commit
      - name: Generate branch coverage
        run: uv run pytest --cov --cov-branch --cov-report=lcov:build/coverage/lcov.info -q
      - name: Require 90 percent coverage on the pull-request diff
        if: github.event_name == 'pull_request'
        run: uv run diff-cover build/coverage/lcov.info --compare-branch "origin/${{ github.base_ref }}" --fail-under=90
      - name: Verify acceptance example wiring
        run: uv run wct accept mutate
      - name: Attack the harness
        run: uv run wct selftest redteam
