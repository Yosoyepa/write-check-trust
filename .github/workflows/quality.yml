name: quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  commit-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Actions pineadas por SHA completo: un tag comprometido no ejecuta
      # código en este repo (Dependabot mantiene los SHAs al día).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
      - name: Install uv
        run: python -m pip install --disable-pip-version-check uv
      - name: Install deterministic environment
        run: uv sync --frozen --group dev --group quality
      - name: Verify generated policy and control-plane integrity
        run: |
          uv run wct rules check
          uv run wct integrity check
          uv run wct doctor
      - name: Run commit tier
        run: uv run wct gate --tier commit
      - name: Audit deployable dependencies (SEC-003)
        run: |
          mkdir -p build
          uv export --frozen --no-dev --no-emit-project --no-hashes --format requirements.txt > build/requirements-audit.txt
          uv run pip-audit --requirement build/requirements-audit.txt
      - name: Generate branch coverage
        run: uv run pytest --cov --cov-branch --cov-report=lcov:build/coverage/lcov.info -q -m "not property"
      - name: Require measured ratchets
        run: uv run wct ratchet check --require coverage-total,docstring-coverage
      - name: Run property tests separately
        run: uv run pytest -q tests/property
      - name: Require 90 percent coverage on the pull-request diff
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: uv run diff-cover build/coverage/lcov.info --compare-branch "origin/${BASE_REF}" --fail-under=90
      - name: Verify acceptance example wiring
        run: uv run wct accept mutate
      - name: Attack the harness
        run: uv run wct selftest redteam
