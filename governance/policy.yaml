# governance/policy.yaml
# Configuración operativa del harness. Editable, pero protegido por G-META-1:
# todo cambio aquí requiere una entrada firmada en governance/integrity-log.md.
#
# Fuente única de verdad. NO edites governance/generated/** ni CLAUDE.md/AGENTS.md
# a mano: se generan con `wct rules build` y `wct rules check` falla si divergen.

schema_version: 1

project:
  name: write_check_trust
  # Lenguaje primario. Determina qué gates se activan.
  language: python
  # Lenguajes secundarios presentes en el repo (activan gates polyglot).
  secondary_languages: []
  python_requires: ">=3.11"
  package_manager: uv

# ---------------------------------------------------------------------------
# Modo de operación — §4 del PLAN
# ---------------------------------------------------------------------------
# solo  : sesión única. Anillos 1-5 activos; el verifier corre en CI (anillo 6).
# pair  : la sesión principal codea; el subagente `verifier` corre en el anillo 4
#         antes de cada Stop. Modela el two-pack de swarm-forge.
# swarm : pipeline completa specifier → coder → cleaner → architect → hardener
#         → verifier, cada uno en su worktree. Coste alto, opt-in explícito.
mode: solo

# ---------------------------------------------------------------------------
# Perfil de calidad — §5.3 del PLAN
# ---------------------------------------------------------------------------
# Controla el umbral aplicado al REPO COMPLETO. El código CAMBIADO se evalúa
# siempre con `strict`, independientemente de este valor: un repo legacy no
# autoriza escribir código nuevo malo.
profile: strict

# Perfil de lint. `ruff` es el canónico (decisión ADR-002).
# `legacy` conmuta G-LINT/G-FMT/G-IMPORT-ORDER a flake8 + isort + black,
# con el mismo umbral (0 findings). Ver governance/lint/legacy/.
lint_profile: ruff

# Modo de la escalera de minimalismo (ponytail vendorizado, ADR-001).
# off | lite | full.  `ultra` está PROHIBIDO (override 4).
minimalism_mode: lite

# ---------------------------------------------------------------------------
# Rutas
# ---------------------------------------------------------------------------
paths:
  source: [src]
  tests: [tests]
  features: [features]
  tools: [tools]
  build: build
  # Rutas protegidas por G-META-1. Editarlas requiere blessing humano.
  protected:
    - governance/**
    - .claude/settings.json
    - .claude/skills/**
    - .pre-commit-config.yaml
    - .importlinter
    - .github/workflows/**
    - pyproject.toml
    - uv.lock
    - .secrets.baseline
    - tools/wct/**
    - quality/redteam/**
    - skills/**
    - .claude/agents/**
    - plugins/write-check-trust/**
  # Rutas generadas. PreToolUse bloquea escrituras directas: se regeneran.
  generated:
    - governance/generated/**
    - CLAUDE.md
    - AGENTS.md
    - .cursor/rules/**
    - .github/copilot-instructions.md
    - GEMINI.md
    - QUALITY.md

# ---------------------------------------------------------------------------
# Capas arquitectónicas — la definición vive aquí; los contratos ejecutables
# se generan a .importlinter con `wct rules build`.
# ---------------------------------------------------------------------------
architecture:
  root_package: example
  # Orden de MÁS alto nivel (lejos de IO) a MÁS bajo nivel (cerca de IO).
  # La Dependency Rule: cada capa solo puede importar capas por debajo de ella
  # en esta lista. domain no puede importar nada del proyecto.
  layers:
    - entrypoints
    - adapters
    - application
    - domain
  # Paquetes externos prohibidos por capa. Override 1 de ponytail: el peldaño
  # "usa la dependencia ya instalada" NO aplica en estas capas.
  forbidden_external:
    domain:
      - sqlalchemy
      - fastapi
      - flask
      - django
      - requests
      - httpx
      - pydantic          # framework de validación = detalle de adaptador
      - boto3
      - redis
      - psycopg
      - psycopg2
      - pymongo
      - kafka
      - celery
    application:
      - sqlalchemy
      - fastapi
      - flask
      - django
      - requests
      - httpx
      - boto3
      - redis
      - psycopg
      - psycopg2
      - pymongo
      - kafka
      - celery
  # Módulos ambientalmente inadecuados (engineering.prompt de swarm-forge):
  # abren GUIs, dependen de dispositivos, cuelgan bajo test. Se EXCLUYEN de
  # coverage, mutación, CRAP y DRY. Mantén esta lista mínima.
  unsuitable_for_test: []

# ---------------------------------------------------------------------------
# Proveedores de agentes para los que se generan reglas — §14
# ---------------------------------------------------------------------------
providers:
  - id: claude
    target: CLAUDE.md
  - id: agents-md
    target: AGENTS.md
  - id: cursor
    target: .cursor/rules/wct.mdc
  - id: copilot
    target: .github/copilot-instructions.md
  - id: gemini
    target: GEMINI.md
  - id: windsurf
    target: .windsurf/rules/wct.md

# ---------------------------------------------------------------------------
# Variables de entorno que cada tier exige (p. ej. DSN de una base de datos
# real para tests de integración). Si falta alguna, el tier falla ANTES de
# correr gates, con un mensaje que nombra la variable: nunca como skips
# silenciosos ni errores crípticos de conexión a mitad de suite.
# ---------------------------------------------------------------------------
environment_required:
  fast: []
  commit: []
  pr: []
  full: []

# ---------------------------------------------------------------------------
# Flags de gates. Un gate desactivado aparece en `wct report` como NO CUBIERTO
# y el modo de fallo que cubría queda listado como no verificado.
# ---------------------------------------------------------------------------
gates:
  disabled: []
  # Gates que requieren herramientas externas opcionales. Si la herramienta
  # falta, el gate reporta SKIPPED (visible en el report) en vez de fallar.
  optional_tools:
    - G-DRY-TOK      # jscpd (node)
    - G-SAST-SEMGREP # semgrep
    - G-SBOM         # cyclonedx-py
